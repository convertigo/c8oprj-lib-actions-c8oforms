  expression: |
    '// Deletes the response stored for this form: doc must be a saved response whose formId is the id of originalDoc.
    var submitted = _doc != null && _doc.doc != null ? _doc.doc : _doc;
    var form = _originalDoc != null && _originalDoc.originalDoc != null ? _originalDoc.originalDoc : _originalDoc;
    var stored = null;
    try {
    	stored = submitted != null && submitted._id != null ? JSON.parse("" + com.twinsoft.convertigo.engine.Engine.theApp.couchDbManager
    		.getFullSyncClient().getDocument("c8oforms_response_fs", "" + submitted._id).toString()) : null;
    } catch (e) {
    	stored = null;
    }
    if (stored == null || stored.error || stored._deleted || form == null || form._id == null ||
    		("" + stored.formId) != ("" + form._id)) {
    	throw new java.lang.Exception("Response not found for this form");
    }
    var storedResponseId = "" + stored._id;'
